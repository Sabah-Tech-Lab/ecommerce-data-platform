[project]
name = "ecommerce-data-platform"
version = "0.1.0"
description = "An end-to-end data engineering project for e-commerce analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
